
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock & Countdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Digital Clock</h1>
        <p class="subtitle">Your Time, Your Moment</p>

        <!-- Digital Clock -->
        <div class="clock-box">
            <h2>Current Time</h2>
            <div id="clock">00:00:00</div>
            <p id="date">Loading date...</p>
        </div>

        <!-- Countdown Timer -->
        <div class="countdown-box">
            <h2>New Year 2027 Countdown</h2>

            <div class="countdown">
                <div class="time-unit">
                    <span id="days">00</span>
                    <p>Days</p>
                </div>

                <div class="time-unit">
                    <span id="hours">00</span>
                    <p>Hours</p>
                </div>

                <div class="time-unit">
                    <span id="minutes">00</span>
                    <p>Minutes</p>
                </div>

                <div class="time-unit">
                    <span id="seconds">00</span>
                    <p>Seconds</p>
                </div>
            </div>
        </div>

        <footer>
            <p>Created by Hira M.</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
